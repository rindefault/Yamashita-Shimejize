# ??? Quality Profiles ???????????????????????????????????????????????????????
# LOWEST  ? flat lighting, no shadow map lookups, zero post-process.
#            Use on very weak or integrated GPUs.
# LOW     ? real shadow map (256 px, 64 blk), minimal effects.
# NORMAL  ? balanced default: 1024 px shadows, clouds, standard effects.
# HIGH    ? maximum: 2048 px shadows, full render distance, all effects.

profile.LOWEST=FLAT_LIGHTING=1 SHADOW_ENTITY=-1 ENABLE_GODRAYS=0 ENABLE_BLOOM=0 ENABLE_AURORA=0 ENABLE_RAINBOW=0 ENHANCED_CLOUDS=0 CLOUD_SHADOWS=0 ENABLE_LENS_FLARE=0 ENABLE_HEAT_HAZE=0 ENABLE_SHOOTING_STARS=0 ENABLE_MOTIONBLUR=0 ENABLE_PUDDLES=0 ENABLE_PIXEL_DOF=0 PIXEL_FOLIAGE_WIND=0 shadowMapResolution=256 shadowDistance=32.0 entityShadowDistanceMul=0.125
profile.LOW=profile.LOWEST FLAT_LIGHTING=0 ENABLE_AURORA=1 ENABLE_BLOOM=1 shadowMapResolution=512 shadowDistance=64.0 entityShadowDistanceMul=0.125
profile.NORMAL=profile.LOW SHADOW_ENTITY=0 ENABLE_GODRAYS=1 ENABLE_RAINBOW=1 ENHANCED_CLOUDS=1 CLOUD_SHADOWS=1 ENABLE_LENS_FLARE=1 ENABLE_HEAT_HAZE=1 ENABLE_SHOOTING_STARS=1 ENABLE_MOTIONBLUR=1 ENABLE_PUDDLES=1 ENABLE_PIXEL_DOF=1 PIXEL_FOLIAGE_WIND=1 shadowMapResolution=1024 shadowDistance=128.0 entityShadowDistanceMul=0.2
profile.HIGH=profile.NORMAL SHADOW_ENTITY=1 shadowMapResolution=2048 shadowDistance=256.0 entityShadowDistanceMul=0.5

# ??? Screen Layout ???????????????????????????????????????????????????????????

screen=<profile> [LIGHTING_SCREEN] <empty> [FOG_SCREEN] <empty> [COLORS_SCREEN] <empty> [GIMMICKS_SCREEN]

# Lighting: image controls first, shadow tuning below
screen.LIGHTING_SCREEN=ENABLE_GODRAYS ENABLE_BLOOM ENABLE_RAINBOW ENABLE_ANAGLYPH BRIGHTNESS CONTRAST REFLECTIONS POSTERIZE_STRENGTH shadowDistance shadowMapResolution entityShadowDistanceMul SHADOW_ENTITY SUN_BRIGHTNESS SHADOW_DARKNESS sunPathRotation <empty>
screen.LIGHTING_SCREEN.columns=2

# Fog: world and weather first, End sky below
screen.FOG_SCREEN=ENABLE_FOG ENABLE_AURORA OVERWORLD_FOG_MIN_SLIDER OVERWORLD_FOG_MAX_SLIDER NETHER_FOG_SLIDER WEATHER_OPACITY <empty> <empty> END_STARS_SPEED END_STARS_AMOUNT END_STARS_OPACITY <empty>
screen.FOG_SCREEN.columns=2

# Colors: pair torch core and glow channels, then moon tint
screen.COLORS_SCREEN=TORCH_R TORCH_OUTER_R TORCH_G TORCH_OUTER_G TORCH_B TORCH_OUTER_B <empty> <empty> MOON_R MOON_G MOON_B <empty>
screen.COLORS_SCREEN.columns=2

# Atmosphere: sky, foliage, post, weather, then world accents
screen.GIMMICKS_SCREEN=ENHANCED_CLOUDS CLOUD_SHADOWS ENABLE_SHOOTING_STARS CLOUD_SHADOW_STRENGTH <empty> <empty> PIXEL_FOLIAGE_WIND FOLIAGE_WIND_RES <empty> <empty> ENABLE_PIXEL_DOF DOF_STRENGTH ENABLE_MOTIONBLUR ENABLE_HEAT_HAZE <empty> <empty> ENABLE_LENS_FLARE ENABLE_RAIN_DROPS ENABLE_PUDDLES RAIN_DROPS_OPACITY <empty> <empty> HAND_DYNAMIC_LIGHTING GLOWING_ORES HIGHLIGHT_WAXED <empty>
screen.GIMMICKS_SCREEN.columns=2

# ??? Sliders ?????????????????????????????????????????????????????????????????

sliders=SUN_BRIGHTNESS CONTRAST BRIGHTNESS POSTERIZE_STRENGTH SHADOW_DARKNESS CLOUD_SHADOW_STRENGTH DOF_STRENGTH RAIN_DROPS_OPACITY WATER_B WATER_A TORCH_R TORCH_G TORCH_B TORCH_OUTER_R TORCH_OUTER_G TORCH_OUTER_B shadowDistance OVERWORLD_FOG_MIN_SLIDER OVERWORLD_FOG_MAX_SLIDER NETHER_FOG_SLIDER shadowMapResolution REFLECTIONS WATER_MIN_TEXTURE entityShadowDistanceMul sunPathRotation MOON_R MOON_G MOON_B END_STARS_SPEED END_STARS_AMOUNT END_STARS_OPACITY WEATHER_OPACITY

# ??? Renderer Options ????????????????????????????????????????????????????????

separateAo=true

#if ENHANCED_CLOUDS > 0
clouds=off
program.gbuffers_clouds.enabled=false
program.world0/gbuffers_clouds.enabled=false
program.world1/gbuffers_clouds.enabled=false
program.world-1/gbuffers_clouds.enabled=false
#else
program.gbuffers_clouds.enabled=true
program.world0/gbuffers_clouds.enabled=true
program.world1/gbuffers_clouds.enabled=true
program.world-1/gbuffers_clouds.enabled=true
#endif

oldHandLight=true
wetnessHalflife=120
drynessHalflife=1800
rain.depth=false
particles.ordering=mixed

alphaTest.gbuffers_weather=GREATER 0.0001
alphaTest.gbuffers_clouds=GREATER 0.0001
alphaTest.gbuffers_water=GREATER 0.0001
customTexture.cloudstex=lib/textures/clouds.png
customTexture.waterdropstex=lib/textures/water_drops.png
customTexture.endportaltex=lib/textures/end_portal.png
customTexture.endskytex=lib/textures/end_sky.png
scale.deferred=0.25
scale.world0/deferred=0.25
scale.world1/deferred=0.25
scale.world-1/deferred=0.25
#if FLAT_LIGHTING > 0
oldLighting=false
#else
oldLighting=true
#endif

#if SHADOW_ENTITY >= 1 || (!defined IS_IRIS && SHADOW_ENTITY >= 0)
shadowEntities=true
#else
shadowEntities=false
#endif

#if SHADOW_ENTITY >= 0
shadowPlayer=true
#else
shadowPlayer=false
#endif

# ??? Custom Uniforms ?????????????????????????????????????????????????????????

uniform.float.timeAngle=worldTime / 24000
uniform.float.timeBrightness=max(sin(timeAngle * 6.28318530718), 0.0)
uniform.float.rainbowWetMemory=smooth(21, rainStrength, 3, 1200)

# Biome cold/warm detection with elevation modifiers for mountain biomes
variable.float.yCold1=if(cameraPosition.y >= 93.0, 1, 0)
variable.float.yCold2=if(cameraPosition.y >= 123.0, 1, 0)
variable.float.yCold3=if(cameraPosition.y >= 153.0, 1, 0)

#if MC_VERSION >= 11800
uniform.float.isCold=smooth(1, if(in(biome, BIOME_GROVE, BIOME_FROZEN_OCEAN, BIOME_FROZEN_RIVER, BIOME_SNOWY_PLAINS, BIOME_SNOWY_BEACH, BIOME_SNOWY_TAIGA, BIOME_ICE_SPIKES), 1, 0), 10, 10) + \
                     smooth(11, if(in(biome, BIOME_WINDSWEPT_HILLS, BIOME_STONY_SHORE, BIOME_WINDSWEPT_FOREST, BIOME_WINDSWEPT_GRAVELLY_HILLS), 1, 0) * yCold1, 10, 10) + \
                     smooth(12, if(in(biome, BIOME_TAIGA, BIOME_OLD_GROWTH_PINE_TAIGA), 1, 0) * yCold2, 10, 10) + \
                     smooth(13, if(in(biome, BIOME_OLD_GROWTH_SPRUCE_TAIGA), 1, 0) * yCold3, 10, 10)
uniform.float.isWarm=smooth(2, if(in(biome, BIOME_DESERT, BIOME_BADLANDS, BIOME_WOODED_BADLANDS, BIOME_ERODED_BADLANDS, BIOME_SAVANNA, BIOME_SAVANNA_PLATEAU, BIOME_WINDSWEPT_SAVANNA, BIOME_NETHER_WASTES, BIOME_BASALT_DELTAS), 1, 0), 10, 10)
#else
uniform.float.isCold=smooth(1, if(in(biome, 10, 11, 12, 13, 26, 30, 31, 140, 158), 1, 0), 10, 10) + \
                     smooth(11, if(in(biome, 3, 25, 34, 131, 162), 1, 0) * yCold1, 10, 10) + \
                     smooth(12, if(in(biome, 5, 19, 32, 33, 133), 1, 0) * yCold2, 10, 10) + \
                     smooth(13, if(in(biome, 160, 161), 1, 0) * yCold3, 10, 10)
uniform.float.isWarm=smooth(2, if(in(biome, 2, 17, 35, 36, 37, 38, 39), 1, 0), 10, 10)
#endif
