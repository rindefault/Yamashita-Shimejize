shadowEntities=true
#else
shadowEntities=false
#endif

#if SHADOW_ENTITY >= 0
shadowPlayer=true
#else
shadowPlayer=false
#endif

#ifndef IS_IRIS
program.gbuffers_clouds.enabled=false
program.gbuffers_skybasic.enabled=false
program.gbuffers_armor_glint.enabled=false
#endif